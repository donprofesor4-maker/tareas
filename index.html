<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrega de Tareas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; display:flex; align-items:center; justify-content:center;
  padding: 20px;
}
.card {
  background: white; border-radius: 20px; padding: 40px;
  max-width: 500px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 { text-align:center; color:#333; margin-bottom:5px; font-size:1.8em; }
.sub { text-align:center; color:#888; margin-bottom:25px; font-size:0.9em; }
label { display:block; margin-bottom:6px; color:#333; font-weight:600; }
input, select { width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:10px; font-size:1em; margin-bottom:15px; }
input:focus, select:focus { outline:none; border-color:#667eea; }
input[type=file] { padding:10px; }
.btn {
  width:100%; padding:14px; background:#667eea; color:white;
  border:none; border-radius:12px; font-size:1.1em; font-weight:600;
  cursor:pointer; transition:background 0.3s;
}
.btn:hover { background:#5a6fd6; }
.btn:disabled { background:#aaa; }
.msg { text-align:center; margin-top:15px; font-weight:600; display:none; }
.msg.ok { color:green; display:block; }
.msg.err { color:red; display:block; }
.loading { display:none; text-align:center; margin-top:10px; color:#888; }
</style>
</head>
<body>

<div class="card">
  <h1>Entregar Tarea</h1>
  <p class="sub">Sube tu trabajo</p>

  <form id="form">
    <label>Nombre completo</label>
    <input type="text" id="nombre" required>

    <label>Grado</label>
    <select id="grado" required>
      <option value="">Selecciona...</option>
      <option>1° Primaria</option>
      <option>2° Primaria</option>
      <option>3° Primaria</option>
      <option>4° Primaria</option>
      <option>5° Primaria</option>
      <option>6° Primaria</option>
      <option>1° Secundaria</option>
      <option>2° Secundaria</option>
      <option>3° Secundaria</option>
    </select>

    <label>Archivo</label>
    <input type="file" id="archivo" required accept=".pdf,.doc,.docx,.jpg,.png,.zip">

    <button type="submit" class="btn" id="btn">Enviar Tarea</button>
  </form>

  <p class="msg ok" id="ok">Enviado correctamente</p>
  <p class="msg err" id="err"></p>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAZHYM9aWvQoGeXOdvYfFcpFh5C3LCaP8X_oIF05rlHQCUeMNZD_usyXNyYM89Uqo/exec';

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('btn').disabled = true;

  const fd = new FormData();
  fd.append('nombre', document.getElementById('nombre').value);
  fd.append('grado', document.getElementById('grado').value);
  fd.append('archivo', document.getElementById('archivo').files[0]);

  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('ok').style.display = 'block';
      document.getElementById('err').style.display = 'none';
    } else {
      document.getElementById('err').textContent = data.error || 'Error';
      document.getElementById('err').style.display = 'block';
    }
  } catch (err) {
    document.getElementById('err').textContent = 'Error de conexion';
    document.getElementById('err').style.display = 'block';
  }
  document.getElementById('btn').disabled = false;
});
</script>

</body>
</html>
